name: 构建 youxiang 扩展（Linux .so / Windows .dll）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', os: ubuntu-latest }
          - { php: '8.0', os: ubuntu-latest }
          - { php: '8.1', os: ubuntu-latest }
          - { php: '8.2', os: ubuntu-latest }
          - { php: '8.3', os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, curl, gd, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: 准备构建工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf pkg-config > /dev/null
          php -v
          phpize --version

      - name: 编译扩展
        run: |
          phpize
          ./configure --enable-youxiang
          make -j"$(nproc)"

      - name: 校验发布版不含调试输出
        run: |
          if strings modules/youxiang.so | grep -q "youxiang] compile"; then
            echo "发布版产物包含调试输出字符串，构建中止"
            exit 1
          fi
          echo "发布版产物：不含调试输出 ✓"

      - name: 上传 youxiang.so
        uses: actions/upload-artifact@v4
        with:
          name: youxiang-php${{ matrix.php }}-ubuntu-latest
          path: modules/youxiang.so
          if-no-files-found: error

      - name: 上传源码包（便于离线部署）
        uses: actions/upload-artifact@v4
        with:
          name: youxiang-src-php${{ matrix.php }}
          path: |
            src/youxiang.c
            config.m4
          if-no-files-found: error

  e2e:
    name: 端到端（真实程序包 + 扩展）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl, curl, gd, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: 拉取程序包源码
        run: git clone --depth 1 https://github.com/YeXuanHs/youxiang-finance.git app

      - name: 关闭源码级内置授权（强制由扩展负责识别）
        run: |
          sed -i "s/const ALWAYS_AUTHORIZED = true;/const ALWAYS_AUTHORIZED = false;/" app/includes/license.php
          grep -n "ALWAYS_AUTHORIZED = " app/includes/license.php

      - name: 编译扩展
        run: |
          phpize
          ./configure --enable-youxiang
          make -j"$(nproc)"

      - name: 启动站点（带扩展）
        run: |
          php -d extension=$PWD/modules/youxiang.so -S 127.0.0.1:8123 -t app > /tmp/srv.log 2>&1 &
          sleep 3
          curl -sS -o /dev/null -w "首页 HTTP %{http_code}\n" http://127.0.0.1:8123/index.php

      - name: 走完安装向导（授权码填随机 md5）
        run: |
          set -e
          B=http://127.0.0.1:8123/install/install.php
          J=/tmp/jar.txt
          T=$(curl -sS -c $J "$B?step=1" | grep -oE 'name="_csrf" value="[a-f0-9]+"' | grep -oE '[a-f0-9]{16,}' | head -1)
          curl -sS -c $J -b $J -o /dev/null -d "_csrf=$T" -d "action=step1" -d "agree=1" "$B?step=1"
          T=$(curl -sS -c $J -b $J "$B?step=2" | grep -oE 'name="_csrf" value="[a-f0-9]+"' | grep -oE '[a-f0-9]{16,}' | head -1)
          curl -sS -c $J -b $J -o /dev/null -d "_csrf=$T" -d "action=step2" "$B?step=2"
          T=$(curl -sS -c $J -b $J "$B?step=3" | grep -oE 'name="_csrf" value="[a-f0-9]+"' | grep -oE '[a-f0-9]{16,}' | head -1)
          curl -sS -c $J -b $J -o /dev/null -d "_csrf=$T" -d "action=step3" -d "site_name=E2E" -d "site_domain=e2e.local" -d "admin_path=admin" -d "edition=enterprise" -d "driver=sqlite" -d "prefix=yx_" --data-urlencode "db_path=/tmp/e2e.db" "$B?step=3"
          T=$(curl -sS -c $J -b $J "$B?step=4" | grep -oE 'name="_csrf" value="[a-f0-9]+"' | grep -oE '[a-f0-9]{16,}' | head -1)
          CODE=$(php -r "echo md5('youxiang-e2e');")
          echo "使用的授权码（随机 md5）: $CODE"
          curl -sS -c $J -b $J -L -o /tmp/step4.html -w "step4 HTTP %{http_code}\n" -d "_csrf=$T" -d "action=step4" -d "admin_user=admin" -d "admin_pass=Admin12345" -d "admin_pass2=Admin12345" -d "admin_email=a@b.com" -d "license_key=$CODE" "$B?step=4"
          if grep -q "安装完成" /tmp/step4.html; then
            echo "安装向导完成"
          else
            echo "安装未完成，页面片段："; tail -40 /tmp/step4.html; exit 1
          fi

      - name: 诊断（钩子是否命中真实文件）
        run: |
          php -d extension=$PWD/modules/youxiang.so -r '
          require getcwd() . "/app/includes/bootstrap.php";
          echo "patched_log: " . json_encode(youxiang_patched_log()) . "\n";
          $r = YxLicense::query("e2e.local", true);
          echo "status=" . $r["status"] . " edition=" . $r["edition"] . "\n";
          '

      - name: 校验运行时识别为企业版（由扩展负责）
        run: |
          php -d extension=$PWD/modules/youxiang.so -r '
          require getcwd() . "/app/includes/bootstrap.php";
          $r = YxLicense::query("e2e.local", true);
          echo "status=" . $r["status"] . "  edition=" . $r["edition"] . "  authorized=" . var_export($r["authorized"], true) . "\n";
          exit(($r["status"] === "authorized" && $r["edition"] === "enterprise") ? 0 : 1);
          '
          echo "✓ 真实程序的 YxLicense::query() 已被扩展改写为 authorized / enterprise"

      - name: 校验真实程序的到期日口径（一次性 = 永久）
        run: |
          php -d extension=$PWD/modules/youxiang.so -r '
          require getcwd() . "/app/includes/bootstrap.php";
          $once = YxBusiness::appExpire(["id" => 1, "price" => 366, "bill_type" => "once", "edition_min" => "basic"]);
          $year = YxBusiness::appExpire(["id" => 2, "price" => 199, "bill_type" => "year", "edition_min" => "basic"]);
          echo "once=" . var_export($once, true) . "  year=" . var_export($year, true) . "\n";
          exit(($once === null && $year === date("Y-m-d", strtotime("+1 year"))) ? 0 : 1);
          '
          echo "✓ 一次性商品到期日为永久（NULL），按年商品仍为一年后"

      - name: 双方案并存（源码级开关也打开 + 扩展同时生效）
        run: |
          sed -i "s/const ALWAYS_AUTHORIZED = false;/const ALWAYS_AUTHORIZED = true;/" app/includes/license.php
          grep -n "ALWAYS_AUTHORIZED = " app/includes/license.php
          php -d extension=$PWD/modules/youxiang.so -r '
          require getcwd() . "/app/includes/bootstrap.php";
          $r = YxLicense::query("e2e.local", true);
          echo "query: status=" . $r["status"] . " edition=" . $r["edition"] . " authorized=" . var_export($r["authorized"], true) . "\n";
          $exp = YxBusiness::appExpire(["id" => 1, "price" => 366, "bill_type" => "once", "edition_min" => "basic"]);
          echo "appExpire(once)=" . var_export($exp, true) . "\n";
          $bad = ($r["status"] !== "authorized" || $r["edition"] !== "enterprise" || $exp !== null);
          exit($bad ? 1 : 0);
          '
          echo "✓ 源码级与扩展同时开启：结论一致，无冲突、无报错"

  e2e164:
    name: 端到端（1.6.4 开源版 + 扩展）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl, curl, gd, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: 准备构建工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf pkg-config > /dev/null

      - name: 拉取 1.6.4 开源版程序包
        run: |
          mkdir -p pkg && cd pkg
          # 用 latest 指向当前 Release，避免删旧版时把下载地址带崩
          URL="https://github.com/YeXuanHs/youxiang-ext/releases/latest/download/youxiang-finance-open-1.6.4.zip"
          for i in 1 2 3; do
            curl -sSL --retry 3 --retry-delay 3 -o pkg.zip "$URL" &&               [ "$(stat -c%s pkg.zip)" -gt 10000000 ] && break
            echo "第 $i 次下载失败或文件不完整，重试…"
            sleep 5
          done
          ls -la pkg.zip
          # 大小不对就是没下全（Release 资产偶发 404 会返回几字节的 404 页面）
          [ "$(stat -c%s pkg.zip)" -gt 10000000 ] || { echo "程序包下载不完整"; exit 1; }
          unzip -q pkg.zip
          ls includes/license/
          test -f includes/license/community.php

      - name: 编译扩展
        run: |
          phpize
          ./configure --enable-youxiang
          make -j"$(nproc)"

      - name: 编译前的对照（未装扩展：应为 community / 开源版标识）
        run: |
          php -r '
          require "pkg/includes/functions.php";
          require "pkg/includes/license/community.php";
          $r = YxLicense::query("demo.local", true);
          echo "  status=" . $r["status"] . "  badge=" . YxLicense::badge("demo.local")["text"]
             . "  isAuthorized=" . var_export(YxLicense::isAuthorized("demo.local"), true) . "\n";
          '

      - name: 装上扩展后：授权判定、界面标识与下游查询接口全部变为企业版
        run: |
          php -d extension=$PWD/modules/youxiang.so -r '
          require "pkg/includes/functions.php";
          require "pkg/includes/license/community.php";
          $_REQUEST["domain"] = "demo.local";
          $r = YxLicense::query("demo.local", true);
          $b = YxLicense::badge("demo.local");
          $v = YxLicense::verifyRequest(["app_id" => "x", "sign" => "y"]);
          $s = YxLicense::serveQuery(null);
          $p = YxLicense::servePkgVerify(["domain" => "d", "code" => "c"]);
          $g = YxLicense::servePkgSigVerify(["domain" => "d"]);
          echo "  patched_log: " . json_encode(youxiang_patched_log()) . "\n";
          echo "  query         : status=" . $r["status"] . " edition=" . $r["edition"]
             . " authorized=" . var_export($r["authorized"], true) . "\n";
          echo "  badge         : " . $b["text"] . " (class=" . $b["class"] . ")\n";
          echo "  isAuthorized  : " . var_export(YxLicense::isAuthorized("demo.local"), true) . "\n";
          echo "  maxEdition    : " . YxLicense::maxEdition() . "\n";
          echo "  verifyRequest : ok=" . var_export($v["ok"], true) . " code=" . $v["code"] . "\n";
          echo "  serveQuery    : authorized=" . var_export($s["data"]["authorized"], true)
             . " status=" . $s["data"]["status"] . " official=" . $s["data"]["official"] . "\n";
          echo "  query.official: " . $r["official"] . "\n";
          echo "  servePkgVerify: code=" . $p["code"] . " ok=" . var_export($p["data"]["ok"], true)
             . " edition=" . $p["data"]["edition"] . "\n";
          echo "  servePkgSigVer: code=" . $g["code"] . " ok=" . var_export($g["data"]["ok"], true) . "\n";
          echo "  isCommunity   : " . var_export(YxLicense::isCommunity(), true) . "\n";
          echo "  mode          : " . YxLicense::mode() . "\n";
          echo "  modeLocked    : " . var_export(YxLicense::modeLocked(), true) . "\n";
          // 安装授权码在线复核：正版包靠它才能离线安装（私钥不在发行包内）
          $rc2 = YxLicense::remoteVerifyPackageCode("demo.local", "official", "ABCD-EF12-3456-7890");
          echo "  remoteVerify  : ok=" . var_export($rc2["ok"], true)
             . " edition=" . $rc2["edition"] . "\n";
          // 复刻 admin/licenses.php 的「重新复核」分支：不再被开源版拦截
          if (YxLicense::isCommunity()) {
            echo "  recheck       : 当前为开源版（未启用授权模块），无需校验\n";
          } else {
            $rc = YxLicense::query("demo.local", true);
            echo "  recheck       : 复核完成：" . $rc["message"] . "（来源：" . $rc["source"] . "）\n";
          }
          $ok = ($r["status"] === "authorized" && $r["edition"] === "enterprise"
              && $b["text"] === "域名已正版授权" && $b["class"] === "ok"
              && YxLicense::isAuthorized("demo.local") === true
              && YxLicense::maxEdition() === "enterprise"
              && $v["ok"] === true && $v["code"] === 200
              && $s["data"]["authorized"] === true && $s["data"]["status"] === "authorized"
              && $r["official"] === "AnchorFlow团队" && $s["data"]["official"] === "AnchorFlow团队"
              && $p["code"] === 0 && $p["data"]["ok"] === true && $p["data"]["edition"] === "enterprise"
              && $g["code"] === 0 && $g["data"]["ok"] === true
              && YxLicense::isCommunity() === false
              && YxLicense::mode() === "official"
              && YxLicense::modeLocked() === false
              && $rc2["ok"] === true && $rc2["edition"] === "enterprise");
          exit($ok ? 0 : 1);
          '
          echo "✓ 1.6.4 开源版：授权状态 / 界面标识 / 下游查询接口 均为企业版"

      - name: 回归 A：require_once 二次加载不重复编译（opened_path 已设置）
        run: |
          # zend_compile_string 不设置 op_array->opened_path，
          # require_once 的去重键依赖它；缺了会二次编译 → "Cannot redeclare class"
          php -d extension=$PWD/modules/youxiang.so -r '
          $f = "pkg/includes/license/community.php";
          require  $f;
          require_once $f;
          require_once $f;
          require_once $f;
          echo "  同一文件 require + 3 次 require_once：类未重复声明 ✓\n";
          echo "  class_exists(YxLicense)=" . var_export(class_exists("YxLicense", false), true) . "\n";
          '
          echo "✓ opened_path 已正确设置，重复加载被正确去重"

      - name: 回归 B：插入体自包含（不加载 functions.php 也能跑）
        run: |
          # 插入体若引用 normalize_domain() / now() / self::STATUS_OK 等目标文件符号，
          # 不加载 functions.php 时就会 fatal。这里故意不加载，验证真的自包含。
          php -d extension=$PWD/modules/youxiang.so -r '
          require "pkg/includes/license/community.php";
          $r = YxLicense::query("demo.local", true);
          $b = YxLicense::badge("demo.local");
          $_REQUEST["domain"] = "demo.local";
          $s = YxLicense::serveQuery(null);
          echo "  无 functions.php：query=" . $r["status"] . "/" . $r["edition"]
             . " badge=" . $b["text"] . " serveQuery=" . $s["data"]["status"] . "\n";
          exit(($r["status"] === "authorized" && $r["edition"] === "enterprise"
              && $b["text"] === "域名已正版授权" && $s["data"]["status"] === "authorized") ? 0 : 1);
          '
          echo "✓ 插入体自包含：不依赖 normalize_domain / now / self::STATUS_OK"

      - name: 回归 C：youxiang_selftest() 主动体检
        run: |
          php -d extension=$PWD/modules/youxiang.so -r '
          $r = youxiang_selftest((getcwd()) . "/pkg/includes/license/community.php");
          echo "  target=" . var_export($r["target"], true)
             . " 命中 " . $r["anchors_hit"] . "/" . $r["anchors_total"] . "\n";
          foreach ($r["anchors"] as $a => $hit) {
              if (!$hit) { echo "    未命中: " . $a . "\n"; }
          }
          exit((!empty($r["ok"]) && $r["anchors_hit"] === 11) ? 0 : 1);
          '
          echo "✓ youxiang_selftest() 可主动核对锚点（部署后立刻能验，不必等页面触发）"

      - name: 回归 D：非目标文件不受影响（走原始编译，opcache 照常）
        run: |
          php -d extension=$PWD/modules/youxiang.so -r '
          require "pkg/includes/functions.php";
          echo "  functions.php 正常加载，normalize_domain=" . normalize_domain("WWW.A.com:8080") . "\n";
          '
          echo "✓ 非目标文件走原始 compile_file，行为不变"

      - name: 校验扩展未破坏 1.6.4 的其余逻辑（社区模块仍可正常加载）
        run: |
          php -d extension=$PWD/modules/youxiang.so -r '
          require "pkg/includes/functions.php";
          require "pkg/includes/license.php";
          echo "  loader 加载的模块: " . YX_LICENSE_MODULE . "\n";
          echo "  mode=" . YxLicense::mode() . "  modeLocked=" . var_export(YxLicense::modeLocked(), true) . "\n";
          echo "  packageSecret=\"" . YxLicense::packageSecret() . "\"  (开源版应为空)\n";
          $r = YxLicense::query("demo.local", true);
          exit($r["edition"] === "enterprise" ? 0 : 1);
          '
          echo "✓ 加载器路径下同样生效，且开源版模块本身未被破坏"
